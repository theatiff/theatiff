name: Generate Snake Animation

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: theatiff
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300f7ff&color_dots=%23161b22,%23302b63,%235b3bb5,%237B2FF7,%2300f7ff

      - name: Push Snake Animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
